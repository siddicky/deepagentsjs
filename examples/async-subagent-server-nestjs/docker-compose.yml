services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentdb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  subagent:
    build:
      context: .
      dockerfile: Dockerfile.subagent
    ports:
      - "2024:2024"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/agentdb
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      PORT_SUBAGENT: 2024
    depends_on:
      db:
        condition: service_healthy

  supervisor:
    build:
      context: .
      dockerfile: Dockerfile.supervisor
    ports:
      - "3000:3000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RESEARCHER_URL: http://subagent:2024
      PORT_SUPERVISOR: 3000
    depends_on:
      - subagent
